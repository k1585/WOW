/* =====================================

  ['colType','labelColType'],
  ['colIp','labelColIp'],
  ['colIpChange','labelColIpChange'],
  ['colDevice','labelColDevice'],
  ['colSession','labelColSession'],

  ['refresh','labelRefresh'],

  ['logout','labelLogout'],

const TEXT_KEY = 'page_texts_cache';

let texts = {...DEFAULT_TEXTS};


/* =====================================
   화면 문구 적용
===================================== */

function applyTexts(t){

  texts = {...DEFAULT_TEXTS, ...t};

  document.title = texts.title || ' ';

  const map = {

    tHeading: 'heading',
    tMessage: 'message',
    tCode: 'code',
    tHint: 'hint',
    tNotice: 'notice',

    recordsTitle: 'recordsTitle',
    backBtn: 'back',

    loginNote: 'loginNote',
    loginBtn: 'login',

    recordsNote: 'recordsNote',

    thNumber: 'colNumber',
    thTime: 'colTime',
    thType: 'colType',
    thIp: 'colIp',
    thIpChange: 'colIpChange',
    thDevice: 'colDevice',
    thSession: 'colSession',

    refreshBtn: 'refresh',
    clearBtn: 'clear',
    logoutBtn: 'logout',

    editorTitle: 'editorTitle',
    editorNote: 'editorNote',
    saveTextBtn: 'save',
    resetTextBtn: 'reset'
  };

  for(const [id,key] of Object.entries(map)){
    $(id).textContent = texts[key];
  }

  $('email').placeholder = texts.emailPlaceholder;
  $('password').placeholder = texts.passwordPlaceholder;

  if(currentUser) fillEditor(texts);
}


/* =====================================
   문구 불러오기
===================================== */

function showErrorText(){
  $('errorText').classList.remove('loading');
}

async function loadTexts(){

  let cached = null;

  try{
    cached = JSON.parse(localStorage.getItem(TEXT_KEY));
  }catch{}

  if(cached){
    applyTexts(cached);
    showErrorText();
  }

  const fallback = setTimeout(showErrorText,1500);

  try{

    const snap = await getDoc(textsRef);

    if(snap.exists()){

      applyTexts(snap.data());

      try{
        localStorage.setItem(TEXT_KEY,JSON.stringify(texts));
      }catch{}
    }

  }catch(e){

    console.error('문구 불러오기 실패',e);

  }

  clearTimeout(fallback);
  showErrorText();
}


/* =====================================
   편집기 생성
===================================== */

function buildEditor(){

  $('editorFields').innerHTML = FIELD_GROUPS.map(([key])=>{

    const multi = [
      'message',
      'hint',
      'notice',
      'recordsNote',
      'editorNote',
      'loginNote'
    ].includes(key);

    const tag = multi ? 'textarea' : 'input';

    return `
      <div class="editor-field">
        <label for="field_${key}" id="label_${key}"></label>
        <${tag} id="field_${key}" data-text-key="${key}"></${tag}>
      </div>
    `;

  }).join('');

  for(const [key,labelKey] of FIELD_GROUPS){

    $('label_'+key).textContent = texts[labelKey];

  }
}

function fillEditor(t){

  buildEditor();

  for(const [key] of FIELD_GROUPS){

    const el = $('field_'+key);

    if(el){
      el.value = t[key] ?? '';
    }
  }
}


/* =====================================
   문구 저장
===================================== */

async function saveTexts(){

  const t = {};

  for(const [key] of FIELD_GROUPS){

    t[key] = $('field_'+key).value;

  }

  $('editMsg').style.color = '#2a7';
  $('editMsg').textContent = texts.saving;

  try{

    await setDoc(textsRef,t);

    applyTexts(t);

    try{
      localStorage.setItem(TEXT_KEY,JSON.stringify(texts));
    }catch{}

    $('editMsg').textContent = texts.saved;

  }catch(e){

    $('editMsg').style.color = '#c33';

    $('editMsg').textContent =
      texts.saveFailed.replace('{error}',e.code || e.message);

  }
}


/* =====================================
   접속 정보
===================================== */

function getSession(){

  let s = sessionStorage.getItem('visit_session');

  if(!s){

    s = 'S-' + Math.random().toString(36).slice(2,7).toUpperCase();

    sessionStorage.setItem('visit_session',s);

  }

  return s;
}


function getDevice(){

  const ua = navigator.userAgent;

  const os =
    /Android/i.test(ua) ? 'Android' :
    /iPhone|iPad/i.test(ua) ? 'iOS' :
    /Windows/i.test(ua) ? 'Windows' :
    /Mac/i.test(ua) ? 'Mac' : '기타';

  const br =
    /SamsungBrowser/i.test(ua) ? 'Samsung' :
    /Edg\//i.test(ua) ? 'Edge' :
    /Whale/i.test(ua) ? 'Whale' :
    /Chrome/i.test(ua) ? 'Chrome' :
    /Safari/i.test(ua) ? 'Safari' :
    /Firefox/i.test(ua) ? 'Firefox' : '기타';

  return os + ' · ' + br;
}


async function getIP(){

  try{

    const r = await fetch(
      'https://api.ipify.org?format=json',
      {cache:'no-store'}
    );

    const j = await r.json();

    return j.ip || '확인 실패';

  }catch{

    return '확인 실패';

  }
}


async function addLog(){

  if(logged) return;

  logged = true;

  try{

    const ip = await getIP();

    await addDoc(visits,{

      time: serverTimestamp(),
      ip,
      session: getSession(),
      device: getDevice(),
      who: currentUser ? 'admin' : 'visitor'

    });

  }catch(e){

    console.error('기록 실패',e);

  }
}


/* =====================================
   접속 기록 표시
===================================== */

function esc(s){

  return String(s ?? '').replace(/[&<>"']/g,c=>({

    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'

  }[c]));

}

function fmt(ts){

  return ts
    ? ts.toDate().toLocaleString('ko-KR',{hour12:false})
    : '-';

}


async function render(){

  $('rows').innerHTML =
    `<tr><td colspan="7">${esc(texts.loading)}</td></tr>`;

  try{

    const snap = await getDocs(
      query(visits,orderBy('time','desc'),limit(300))
    );

    const logs = snap.docs.map(d=>d.data());

    $('rows').innerHTML = logs.map((x,i)=>{

      const prev = logs.slice(i+1).find(
        y=>y.device === x.device
      );

      let change;

      if(!prev){

        change =
          `<span class="same">${esc(texts.firstRecord)}</span>`;

      }else if(prev.ip !== x.ip){

        change =
          `<span class="changed">${esc(texts.changed)}</span>
          <span class="same">(${esc(texts.previous)} ${esc(prev.ip)})</span>`;

      }else{

        change =
          `<span class="same">${esc(texts.same)}</span>`;

      }

      const who =
        x.who === 'admin' ? texts.admin :
        x.who === 'visitor' ? texts.visitor : '-';

      return `
        <tr>
          <td>${logs.length-i}</td>
          <td>${fmt(x.time)}</td>
          <td>${esc(who)}</td>
          <td>${esc(x.ip)}</td>
          <td>${change}</td>
          <td>${esc(x.device)}</td>
          <td>${esc(x.session)}</td>
        </tr>
      `;

    }).join('') ||
      `<tr><td colspan="7">${esc(texts.noRecords)}</td></tr>`;

    $('count').textContent =
      texts.countTemplate.replace('{count}',logs.length);

  }catch(e){

    $('rows').innerHTML = `
      <tr>
        <td colspan="7">
          ${esc(texts.loadFailed.replace('{error}',e.code || e.message))}
        </td>
      </tr>
    `;

  }

}


/* =====================================
   화면 전환
===================================== */

function updateView(){

  if(currentUser){

    $('login').style.display = 'none';
    $('list').style.display = 'block';

    fillEditor(texts);

    $('editMsg').textContent = '';

    render();

  }else{

    $('list').style.display = 'none';
    $('login').style.display = 'block';

  }

}

function showRecords(){

  $('error').style.display = 'none';
  $('records').style.display = 'block';

  updateView();

}

function backTo404(){

  $('records').style.display = 'none';
  $('error').style.display = 'block';

}


/* =====================================
   기록 초기화
===================================== */

async function clearData(){

  if(!confirm(texts.confirmClear)) return;

  try{

    while(true){

      const snap = await getDocs(
        query(visits,limit(400))
      );

      if(snap.empty) break;

      const batch = writeBatch(db);

      snap.docs.forEach(d=>batch.delete(d.ref));

      await batch.commit();

    }

    render();

  }catch(e){

    alert(
      texts.deleteFailed.replace('{error}',e.code || e.message)
    );

  }

}


/* =====================================
   로그인 / 로그아웃
===================================== */

async function login(){

  $('loginMsg').textContent = '';

  try{

    await signInWithEmailAndPassword(
      auth,
      $('email').value.trim(),
      $('password').value
    );

    $('password').value = '';

  }catch(e){

    $('loginMsg').textContent = texts.loginFailed;

  }

}

async function logout(){

  await signOut(auth);

}


/* =====================================
   Firebase 인증 상태
===================================== */

onAuthStateChanged(auth,async user=>{

  currentUser = user;

  addLog();

  if($('records').style.display === 'block'){

    updateView();

  }

});


/* =====================================
   버튼 이벤트
===================================== */

$('backBtn').addEventListener('click',backTo404);

$('loginBtn').addEventListener('click',login);

$('password').addEventListener('keydown',e=>{

  if(e.key === 'Enter') login();

});

$('refreshBtn').addEventListener('click',render);

$('clearBtn').addEventListener('click',clearData);

$('logoutBtn').addEventListener('click',logout);

$('saveTextBtn').addEventListener('click',saveTexts);

$('resetTextBtn').addEventListener('click',()=>{

  fillEditor(DEFAULT_TEXTS);

  $('editMsg').style.color = '#777';

  $('editMsg').textContent = texts.resetFilled;

});


/* =====================================
   404 화면 길게 누르기
===================================== */

let timer;

const target = $('errorText');

target.addEventListener('pointerdown',()=>{

  timer = setTimeout(showRecords,1000);

});

['pointerup','pointerleave','pointercancel'].forEach(ev=>{

  target.addEventListener(ev,()=>clearTimeout(timer));

});

target.addEventListener('contextmenu',e=>e.preventDefault());


/* =====================================
   시작
===================================== */

loadTexts();

</script>
</body>
</html>
